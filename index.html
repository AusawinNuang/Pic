<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Online & Live Stream Player</title>
  <!-- CSS เดิมทั้งหมดถูกรักษาไว้ 100% เพื่อไม่ให้กระทบต่อโครงสร้างการแสดงผลเดิม -->
  <style>
    /* สไตล์เดิมทั้งหมดของคุณจะคงอยู่ตรงนี้ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .container {
        grid-template-columns: 2fr 1fr;
      }
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background-color: #000;
      border-radius: 8px;
    }
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #94a3b8;
      text-align: center;
      padding: 20px;
    }
    .placeholder h2 {
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .now-playing-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding: 10px;
      background-color: #0f172a;
      border-radius: 8px;
      gap: 10px;
    }
    .now-playing-info {
      flex: 1;
    }
    .now-playing-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .now-playing-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-top: 2px;
    }
    .status-msg {
      font-size: 0.8rem;
      color: #f43f5e;
      margin-top: 4px;
      display: none;
    }
    .status-msg.visible {
      display: block;
    }
    .episode-bar {
      margin-top: 15px;
      background-color: #0f172a;
      border-radius: 8px;
      padding: 12px;
      display: none;
    }
    .episode-bar.visible {
      display: block;
    }
    .episode-bar-header {
      font-size: 0.9rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .episode-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .ep-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .ep-btn:hover {
      background-color: #334155;
      color: #fff;
    }
    .ep-btn.active {
      background-color: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
    }
    .ep-btn-sub {
      font-size: 0.7rem;
      opacity: 0.8;
    }
    .section-header {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title {
      font-size: 1.2rem;
      color: #fff;
    }
    .channel-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .channel-item {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .channel-item:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .channel-item.active {
      border-color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.05);
    }
    .channel-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 6px;
      background-color: #1e293b;
    }
    .channel-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      word-break: break-word;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <header>
    <h1>ทีวีออนไลน์ & เครื่องเล่นวิดีโอสตรีม</h1>
  </header>

  <div class="container">
    <!-- ส่วนแสดงเครื่องเล่น -->
    <section class="card" aria-label="เครื่องเล่นวิดีโอ">
      <div class="video-container">
        <video id="main-player" controls playsinline></video>
        <div class="placeholder" id="player-placeholder">
          <div>
            <h2>ยังไม่ได้เลือกช่องรายการ</h2>
            <p>เลือกช่องจากรายการเพื่อเริ่มรับชมทีวีออนไลน์</p>
          </div>
        </div>
      </div>
      
      <!-- แถบแสดงข้อมูลช่องที่กำลังเล่นและปุ่มเปิดแอปภายนอก -->
      <div class="now-playing-bar">
        <div class="now-playing-info">
          <div class="now-playing-label" id="current-cat">พร้อมใช้งาน</div>
          <div class="now-playing-title" id="current-title">เลือกช่องเพื่อรับชม</div>
          <div class="status-msg" id="error-msg" role="alert"></div>
        </div>
        
        <!-- [จุดอัปเดต 1/3] เพิ่มปุ่มเปิด Wiseplay แสดงผลเคียงข้างปุ่มเดิมแบบปลอดภัย -->
        <button type="button" id="wiseplay-open-btn" style="display:none; background:linear-gradient(135deg, #10b981, #059669); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(16,185,129,0.35);">▶ เล่นใน Wiseplay</button>
        <a id="external-open-btn" href="#" style="display:none; background:#3b82f6; color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:0.8rem; font-weight:600; white-space:nowrap;">📲 เปิดในแอปภายนอก</a>
      </div>
      
      <div class="episode-bar" id="episode-bar">
        <div class="episode-bar-header">
          <span id="episode-bar-title">เลือกช่องย่อย / ตอนรับชม</span>
        </div>
        <div class="episode-list" id="episode-list"></div>
      </div>
    </section>

    <!-- ส่วนรายชื่อช่อง -->
    <section class="card" aria-label="รายการช่องทั้งหมด">
      <div class="section-header">
        <h2 class="section-title">รายการช่องทีวี</h2>
      </div>
      <div class="channel-list" id="channel-list">
        <!-- รายการช่องจะถูก Render ที่นี่ผ่าน JavaScript -->
      </div>
    </section>
  </div>

  <script>
    // ส่วนควบคุมการสตรีมและสถานะการทำงาน
    let channels = [];
    let activeChannelId = null;
    let activeEpisodeIndex = 0;
    let hlsInstance = null;
    let wakeLockSentinel = null;

    // โหลด Element ต่างๆ
    const videoEl = document.getElementById('main-player');
    const placeholderEl = document.getElementById('player-placeholder');
    const currentTitleEl = document.getElementById('current-title');
    const currentCatEl = document.getElementById('current-cat');
    const errorMsgEl = document.getElementById('error-msg');
    const externalOpenBtn = document.getElementById('external-open-btn');
    const episodeBarEl = document.getElementById('episode-bar');
    const episodeBarTitleEl = document.getElementById('episode-bar-title');
    const episodeListEl = document.getElementById('episode-list');
    const channelListEl = document.getElementById('channel-list');

    // [จุดอัปเดต 2/3] ตัวแปรเก็บสถานะช่องปัจจุบัน และการตั้งค่าปุ่ม Wiseplay
    const wiseplayOpenBtn = document.getElementById('wiseplay-open-btn');
    let currentPlayingUrl = '';
    let currentPlayingTitle = '';

    // ฟังก์ชันคัดลอกข้อความลงคลิปบอร์ดแบบปลอดภัย
    function copyTextSafe(text) {
      if (!text) return;
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).catch(() => {});
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (e) {}
        document.body.removeChild(textarea);
      }
    }

    // [จุดอัปเดตพิเศษ] ฟังก์ชันจัดการเปิดเล่น Wiseplay ผ่าน Deep Link และ Android Intent
    function openInWiseplay(streamUrl, title) {
      if (!streamUrl) return;
      const targetUrl = streamUrl.trim();
      copyTextSafe(targetUrl); // คัดลอกไว้เป็นทางเลือกสำรอง
      
      const encodedUrl = encodeURIComponent(targetUrl);
      const encodedTitle = encodeURIComponent(title || 'Live TV');
      
      // ลิงก์ URI Scheme ของ Wiseplay
      const wiseplayUri = `wiseplay://link?link=${encodedUrl}&name=${encodedTitle}`;
      // ลิงก์ระบบ Android Intent เจาะจงแอป Wiseplay
      const androidIntent = `intent:${targetUrl}#Intent;package=com.wiseplay;type=video/*;end`;

      // หากอยู่ใน WebView ของแอป Android ที่เตรียม Bridge ไว้
      if (window.Android && typeof window.Android.openExternal === 'function') {
        window.Android.openExternal(wiseplayUri);
        return;
      }

      // หากรันบนบราวเซอร์ทั่วไปพยายามยิง Deep Link
      try {
        window.location.href = wiseplayUri;
      } catch (err) {
        window.location.href = androidIntent;
      }
    }

    // [จุดอัปเดตพิเศษ] ฟังก์ชันแสดง/ซ่อนปุ่ม Wiseplay ตามเงื่อนไขอย่างเหมาะสม
    function updateWiseplayButton(url, title, isWiseplayTarget = false) {
      if (!wiseplayOpenBtn) return;
      // แสดงเมื่อ: ได้รับการระบุค่า wiseplay ตรงๆ, หรือเป็นไฟล์ประเภทที่เว็บเล่นไม่ได้ (.mpd, playlist, .w3u)
      if (url && (isWiseplayTarget || url.toLowerCase().includes('.mpd') || url.includes('workers.dev/playlist') || url.endsWith('.w3u'))) {
        wiseplayOpenBtn.style.display = 'inline-block';
        wiseplayOpenBtn.onclick = function () {
          openInWiseplay(url, title);
        };
      } else {
        wiseplayOpenBtn.style.display = 'none';
      }
    }

    if (externalOpenBtn) {
      externalOpenBtn.addEventListener('click', function (e) {
        const targetHref = externalOpenBtn.getAttribute('href');
        if (!targetHref || targetHref === '#') {
          e.preventDefault();
          return;
        }
        copyTextSafe(targetHref);
        if (window.Android && typeof window.Android.openExternal === 'function') {
          e.preventDefault();
          window.Android.openExternal(targetHref);
        }
      });
    }

    // รักษาสถานะหน้าจอไม่ให้ดับเมื่อเครื่องเล่นทำงาน
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        }
      } catch (e) {}
    }

    videoEl.addEventListener('play', requestScreenWakeLock);

    // ดึงค่าข้อมูลและแปลงข้อมูลเข้าสู่ระบบ
    function normalizeItem(item, index) {
      const hasStations = Array.isArray(item.stations) && item.stations.length > 0;
      if (!item._uid) item._uid = item.id || ('item_' + (index + 1));
      return {
        id: item._uid,
        name: item.name || 'ไม่มีชื่อรายการ',
        category: item.category || (hasStations ? 'ละคร/ซีรีส์' : 'ทั่วไป'),
        logo: item.logo || item.image || (hasStations && item.stations[0].image) || '',
        url: item.url || (hasStations ? (item.stations[0].url || '') : ''),
        referer: item.referer || '',
        subtitle: item.subtitle || '',
        import: item.import,
        stations: hasStations ? item.stations : null,
        // [จุดอัปเดต 3/3] บันทึกคุณสมบัติ wiseplay เพื่อส่งต่อไปประมวลผล
        wiseplay: item.wiseplay || (hasStations && item.stations[0] && item.stations[0].wiseplay) || false,
        rawIndex: index
      };
    }

    function showPlayerError(msg, externalUrl = '') {
      if (msg) {
        errorMsgEl.textContent = msg;
        errorMsgEl.classList.add('visible');
      } else {
        errorMsgEl.textContent = '';
        errorMsgEl.classList.remove('visible');
      }
      if (externalUrl) {
        externalOpenBtn.href = externalUrl;
        externalOpenBtn.style.display = 'inline-block';
        // เมื่อเกิดข้อผิดพลาดในการเล่นบนเว็บ และมีลิงก์ภายนอก ให้เสนอทางเลือกเปิด Wiseplay ด้วย
        updateWiseplayButton(externalUrl, currentPlayingTitle || 'Live Stream', true);
      } else {
        externalOpenBtn.style.display = 'none';
      }
    }

    // เชื่อมต่อคำบรรยาย (Subtitle)
    async function attachSubtitle(subUrl) {
      Array.from(videoEl.querySelectorAll('track')).forEach(t => t.remove());
      if (!subUrl) return;
      try {
        const res = await fetch(subUrl);
        if (!res.ok) throw new Error();
        let text = await res.text();
        if (!text.trim().startsWith('WEBVTT')) {
          text = 'WEBVTT\n\n' + text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
        }
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = 'ไทย';
        track.srclang = 'th';
        track.src = URL.createObjectURL(new Blob([text], { type: 'text/vtt' }));
        track.default = true;
        videoEl.appendChild(track);
      } catch (e) {
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = 'ไทย';
        track.srclang = 'th';
        track.src = subUrl;
        track.default = true;
        videoEl.appendChild(track);
      }
    }

    // เล่นสตรีมด้วย Hls.js หรือ Native Player
    function loadStreamUrl(streamUrl, subtitleUrl) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      const url = (streamUrl || '').trim();
      if (!url) {
        showPlayerError('ไม่พบลิงก์สตรีมสำหรับรายการนี้');
        return;
      }
      if (url.toLowerCase().includes('.mpd')) {
        showPlayerError('⚠️ ช่องนี้เข้ารหัส DRM (.mpd) กดปุ่มด้านขวาเพื่อเปิดในแอปภายนอก', url);
        return;
      }
      const isHls = url.toLowerCase().includes('.m3u8') || !url.toLowerCase().includes('.mp4');
      attachSubtitle(subtitleUrl);

      if (isHls && window.Hls && window.Hls.isSupported()) {
        hlsInstance = new window.Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(() => {});
        });
        hlsInstance.on(window.Hls.Events.ERROR, (event, data) => {
          if (data && data.fatal) {
            if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
              hlsInstance.recoverMediaError();
            } else {
              showPlayerError('⚠️ สตรีมนี้บล็อกการเล่นบนเว็บ กดปุ่มด้านขวาเพื่อเปิดผ่านแอปภายนอก', url);
            }
          }
        });
      } else {
        videoEl.src = url;
        videoEl.play().catch(() => {});
      }
    }

    // แสดงผลปุ่มเลือกตอนย่อย (Episodes)
    function renderEpisodes(channel) {
      if (!channel.stations || channel.stations.length === 0) {
        episodeBarEl.classList.remove('visible');
        episodeListEl.innerHTML = '';
        return;
      }
      episodeBarEl.classList.add('visible');
      episodeBarTitleEl.textContent = 'เลือกช่องย่อย / ตอน (' + channel.stations.length + ' รายการ)';
      episodeListEl.innerHTML = '';

      channel.stations.forEach((st, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ep-btn' + (idx === activeEpisodeIndex ? ' active' : '');
        const epName = st.name || ('รายการที่ ' + (idx + 1));
        btn.innerHTML = '<span>' + epName + '</span>' + (st.info ? '<span class="ep-btn-sub">' + st.info + '</span>' : '');
        btn.addEventListener('click', () => {
          activeEpisodeIndex = idx;
          currentTitleEl.textContent = channel.name + ' - ' + epName;
          
          // [จุดอัปเดตพิเศษ] ตรวจสอบและสลับปุ่ม Wiseplay สำหรับตอนย่อยที่ถูกคลิกเลือก
          currentPlayingUrl = st.url;
          currentPlayingTitle = channel.name + ' - ' + epName;
          showPlayerError('');
          updateWiseplayButton(st.url, currentPlayingTitle, Boolean(st.wiseplay || channel.wiseplay));
          
          currentCatEl.textContent = 'หมวดหมู่: ' + channel.category + (st.info ? ' (' + st.info + ')' : '');
          loadStreamUrl(st.url, st.subtitle);
          renderEpisodes(channel);
        });
        episodeListEl.appendChild(btn);
      });
    }

    // เริ่มเล่นช่องรายการ
    async function playChannel(channel) {
      if (!channel) return;
      activeChannelId = channel.id;
      activeEpisodeIndex = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      placeholderEl.style.display = 'none';
      videoEl.classList.add('active');
      currentTitleEl.textContent = channel.name;
      currentCatEl.textContent = 'หมวดหมู่: ' + channel.category;

      if (channel.url && channel.url.includes('workers.dev/playlist')) {
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        videoEl.pause();
        videoEl.removeAttribute('src');
        episodeBarEl.classList.remove('visible');
        currentCatEl.textContent = 'เพลย์ลิสต์ภายนอก (สำหรับแอป IPTV)';
        showPlayerError('⚠️ ลิงก์นี้ล็อกให้เปิดเฉพาะในแอป IPTV (Wiseplay / OTT) กดปุ่มสีฟ้าด้านขวาเพื่อเปิด หรือคัดลอกลิงก์ไปใส่ในแอป IPTV', channel.url);
        copyTextSafe(channel.url);
        return;
      }

      showPlayerError('');

      if (channel.stations && channel.stations.length > 0) {
        const firstEp = channel.stations[0];
        const epName = firstEp.name || 'รายการที่ 1';
        currentTitleEl.textContent = channel.name + ' - ' + epName;
        currentCatEl.textContent = 'หมวดหมู่: ' + channel.category + (firstEp.info ? ' (' + firstEp.info + ')' : '');
        
        // [จุดอัปเดตพิเศษ] ตรวจสอบการย้ายข้อมูลและเปิดใช้งานปุ่ม Wiseplay สำหรับช่องแบบชุด
        currentPlayingUrl = firstEp.url;
        currentPlayingTitle = channel.name + ' - ' + epName;
        updateWiseplayButton(firstEp.url, currentPlayingTitle, Boolean(firstEp.wiseplay || channel.wiseplay));
        
        renderEpisodes(channel);
        loadStreamUrl(firstEp.url, firstEp.subtitle);
      } else {
        // [จุดอัปเดตพิเศษ] จัดการอัปเดตปุ่มสำหรับช่องเดี่ยวปกติ
        currentPlayingUrl = channel.url;
        currentPlayingTitle = channel.name;
        updateWiseplayButton(channel.url, channel.name, Boolean(channel.wiseplay));
        
        renderEpisodes(channel);
        loadStreamUrl(channel.url, channel.subtitle);
      }
      renderChannels();
    }

    videoEl.addEventListener('error', () => {
      if (activeChannelId) {
        showPlayerError('⚠️ ไม่สามารถเล่นไฟล์สตรีมจากลิงก์นี้บนเว็บได้โดยตรง', currentPlayingUrl);
      }
    });

    // Render รายชื่อช่องทั้งหมดทางขวามือ
    function renderChannels() {
      channelListEl.innerHTML = '';
      channels.forEach((item) => {
        const channel = normalizeItem(item, item.rawIndex);
        const div = document.createElement('div');
        div.className = 'channel-item' + (channel.id === activeChannelId ? ' active' : '');
        
        const logo = document.createElement('img');
        logo.className = 'channel-logo';
        logo.src = channel.logo || 'https://via.placeholder.com/50/1e293b/cbd5e1?text=TV';
        logo.alt = channel.name;
        logo.onerror = () => {
          logo.src = 'https://via.placeholder.com/50/1e293b/cbd5e1?text=TV';
        };

        const name = document.createElement('div');
        name.className = 'channel-name';
        name.textContent = channel.name;

        div.appendChild(logo);
        div.appendChild(name);
        div.addEventListener('click', () => playChannel(channel));
        channelListEl.appendChild(div);
      });
    }

    // ตัวอย่าง Mock ข้อมูลช่องเพื่อทดสอบ (สามารถเปลี่ยนไปใช้ fetch โหลดไฟล์ JSON ของคุณได้ปกติ)
    const mockChannelsData = [
      {
        "name": "True Sport HD 1",
        "category": "กีฬา",
        "logo": "https://img5.pic.in.th/file/secure-sv1/ts1.png",
        "url": "https://example.com/live/sport1.m3u8",
        "wiseplay": true // <-- แสดงปุ่มเปิด Wiseplay ทันทีเมื่อคลิกช่องนี้
      },
      {
        "name": "HBO HD (DRM Test)",
        "category": "ภาพยนตร์",
        "url": "https://example.com/stream/hbo.mpd" // <-- จะแสดงปุ่มอัตโนมัติเพราะเป็นประเภท .mpd
      },
      {
        "name": "ช่องทั่วไป 1 (เล่นปกติ)",
        "category": "ทั่วไป",
        "url": "https://example.com/live/general.m3u8" // <-- ช่องธรรมดา เล่นบนเว็บปกติ ปุ่ม Wiseplay จะถูกซ่อนไว้
      }
    ];

    // เริ่มต้นระบบโดยโหลดข้อมูล
    channels = mockChannelsData;
    renderChannels();

  </script>
</body>
</html>
